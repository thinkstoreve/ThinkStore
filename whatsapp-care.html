<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>WhatsApp · Think Care</title>
<style>body{margin:0;background:#f5f5f7;color:#202024;font:16px/1.5 system-ui}main{max-width:1000px;margin:auto;padding:32px 20px}h1{font-size:36px;letter-spacing:-1.5px;margin-bottom:8px}.muted{color:#62626b}a{color:#126b45}button,select{font:inherit;padding:10px 14px;border:1px solid #d5d5da;border-radius:12px;background:white}button{cursor:pointer}button.primary{background:#128c4a;color:white;border-color:#128c4a}button:disabled{opacity:.5;cursor:wait}.contact{background:white;border:1px solid #e6e6ea;border-radius:20px;padding:22px;margin:16px 0}.contact h2{font-size:19px;margin:0}.badge{font-size:13px;padding:5px 10px;border-radius:20px;background:#eef4f0;display:inline-block;margin:8px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}.toolbar{display:flex;gap:20px;align-items:center;flex-wrap:wrap}#status{min-height:24px}details{margin-top:12px}summary{cursor:pointer}label{display:flex;gap:8px;align-items:center}</style>
<main><a href="/staff/">← Volver a Staff</a><h1>WhatsApp de Think Care</h1><p class="muted">Ustedes atienden primero. Asignen el asistente únicamente cuando el cliente necesite ayuda para registrar su solicitud.</p><div class="toolbar"><button id="refresh">Actualizar conversaciones</button><a href="https://care.thinkstore.com.ve/" target="_blank" rel="noopener">Ver Think Care ↗</a></div><p id="status" role="status" aria-live="polite">Validando sesión interna…</p><div id="contacts"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-config.js"></script>
<script>
const cfg=window.THINKSTORE_SUPABASE||{},client=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_PUBLISHABLE_KEY),status=document.getElementById('status'),list=document.getElementById('contacts');
async function api(action,data={}){const {data:auth}=await client.auth.getSession();if(!auth.session)throw Error('Inicia sesión con tu cuenta administradora en Staff y vuelve a esta página.');const r=await fetch('/.netlify/functions/whatsapp-admin',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+auth.session.access_token},body:JSON.stringify({action,...data})});const result=await r.json();if(!r.ok||!result.ok)throw Error(result.error||'No se pudo completar la acción');return result;}
function el(tag,text,cls){const n=document.createElement(tag);if(text)n.textContent=text;if(cls)n.className=cls;return n;}
async function load(){status.textContent='Cargando conversaciones…';try{const r=await api('care_contacts');list.replaceChildren();for(const c of r.rows||[]){const card=el('article',null,'contact'),bot=c.metadata?.care_assistant,active=bot?.active&&!c.needs_human&&Date.parse(bot.expires_at)>Date.now();card.append(el('h2',c.name||'Cliente'),el('div','+'+c.phone_e164,'muted'),el('span',active?'Asistente asignado · '+bot.step:'Atención personal','badge'),el('pre',c.last_message_preview||'Sin texto reciente'));const actions=el('div',null,'actions'),label=el('label','Modalidad'),select=el('select');for(const name of ['Essential','Lab Mobile','Pickup','Business']){const o=el('option',name);o.value=name;select.append(o);}label.append(select);const assign=el('button','Asignar asistente','primary'),human=el('button','Atender personalmente'),open=el('a','Abrir WhatsApp ↗');open.href='https://wa.me/'+encodeURIComponent(c.phone_e164);open.target='_blank';open.rel='noopener';assign.disabled=!!active;async function change(action){assign.disabled=human.disabled=true;status.textContent='Guardando…';try{await api(action,{phone:c.phone_e164,service:select.value});await load();}catch(e){status.textContent=e.message;assign.disabled=!!active;human.disabled=false;}}assign.onclick=()=>change('assign_care_bot');human.onclick=()=>change('assign_human');actions.append(label,assign,human,open);card.append(actions);if(bot?.data){const details=el('details'),summary=el('summary','Datos de la solicitud'),text=el('pre');summary.textContent=bot.completed_at?'Solicitud registrada · '+bot.request_id.slice(0,8).toUpperCase():'Datos recopilados';text.textContent=Object.entries(bot.data).map(([k,v])=>({name:'Nombre',device:'Equipo',location:'Dirección',problem:'Problema'}[k]||k)+': '+v).join('\n');details.append(summary,text);card.append(details);}list.append(card);}status.textContent=(r.rows?.length||0)+' conversaciones. El asistente registra solicitudes; el equipo confirma las visitas.';}catch(e){status.textContent=e.message;}}
document.getElementById('refresh').onclick=load;load();
</script></html>
