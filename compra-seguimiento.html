<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Mi pedido · ThinkStore</title><link rel="icon" href="/favicon.ico"><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}header{background:#fff;border-bottom:1px solid #e5e5ea;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px}header img{height:32px;width:32px;object-fit:contain}header>a:first-child{display:flex;gap:9px;align-items:center;font-weight:750;color:#1d1d1f;text-decoration:none}main{max-width:960px;margin:34px auto;padding:0 20px 50px}h1{font-size:clamp(28px,5vw,44px);letter-spacing:-.04em;margin:8px 0}h2{font-size:19px;letter-spacing:-.02em}p{line-height:1.6;color:#6e6e73}.eyebrow{font-size:11px;letter-spacing:.12em;font-weight:750;color:#0071e3}.card{background:#fff;border:1px solid #e5e5ea;border-radius:22px;padding:24px;margin-top:18px;min-width:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.grid .card{margin:0}.badge{display:inline-block;background:#fff2cf;color:#835d08;padding:8px 12px;border-radius:999px;font-size:12px;font-weight:650}.badge.paid{background:#eaf8ef;color:#167342}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:11px 17px;border:1px solid #0071e3;border-radius:999px;background:#0071e3;color:#fff;font:inherit;font-size:13px;text-decoration:none;cursor:pointer;margin:6px 6px 6px 0}.btn.ghost{color:#1d1d1f;border-color:#d2d2d7;background:#fff}.btn:disabled{opacity:.5;cursor:not-allowed}label{display:block;font-size:12px;margin:15px 0 8px;color:#51515a}input{display:block;min-height:44px;width:100%;padding:11px;border:1px solid #d2d2d7;border-radius:10px;font:inherit;font-size:14px;margin-top:8px}.line{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid #f1f1f3}.line span{color:#6e6e73}.line b{overflow-wrap:anywhere;text-align:right}.total{font-size:24px}.success{color:#167342}.error{color:#b42318;font-size:13px;line-height:1.6}#feedback{white-space:pre-line}small{display:block;font-size:11px;color:#6e6e73;line-height:1.6}.status-copy{background:#f5f5f7;border-radius:14px;padding:15px}.items{list-style:none;margin:0;padding:0}.items li{padding:13px 0;border-bottom:1px solid #f1f1f3}.items b{display:block;font-size:14px}.items span{font-size:12px;color:#6e6e73}.note{font-size:13px;color:#6e6e73}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #0071e3;outline-offset:3px}@media(max-width:650px){.grid{grid-template-columns:1fr}header{padding:14px}main{padding:0 14px}input{font-size:16px}}@media(prefers-reduced-motion:no-preference){.btn{transition:transform .18s,background .18s}.btn:active{transform:scale(.97)}.card{animation:show .3s ease}@keyframes show{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}}
</style></head><body><header><a href="/"><img src="logo-thinkstore.png" alt="">ThinkStore</a><a class="btn ghost" href="/panel.html#pedidos">Mi cuenta</a></header><main><p class="eyebrow">SEGUIMIENTO DE COMPRA</p><h1>Tu pedido, siempre a mano.</h1><p>No necesitas mantener esta ventana abierta. Guarda el enlace y vuelve cuando quieras.</p><div id="content" class="card" aria-live="polite">Consultando tu pedido…</div><p id="feedback" class="error" role="alert"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
(()=>{
 const cfg=window.THINKSTORE_SUPABASE||{},sb=window.supabase?.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_PUBLISHABLE_KEY),code=new URLSearchParams(location.search).get('code')||'',E=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),M=n=>'$'+Number(n||0).toFixed(2);let order=null,sending=false;
 async function call(action,extra={}){const session=(await sb.auth.getSession())?.data?.session;if(!session?.access_token)throw Error('LOGIN');const r=await fetch('/.netlify/functions/client-order',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify({action,code,...extra})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw Error(d.error||'No se pudo consultar el pedido.');return d;}
 async function load(){if(sending||document.hidden)return;try{if(!code)throw Error('Falta el número de pedido. Ábrelo desde Mi cuenta.');const data=await call('get_status');order=data.pedido;draw(data.payment_verified);}catch(e){if(e.message==='LOGIN'){document.getElementById('content').innerHTML=`<h2>Tu compra es privada.</h2><p>Inicia sesión con la cuenta que usaste al comprar para ver el pedido.</p><a class="btn" href="/login.html?next=${encodeURIComponent(location.pathname+location.search)}">Iniciar sesión →</a>`;}else document.getElementById('feedback').textContent=e.message;}}
 function draw(paid){const o=order,locked=paid||/rechazado|cancelado|entregado/i.test(o.estado),statusText=paid?'Pago confirmado. Tu pedido puede avanzar a preparación y entrega.':/verificando/i.test(o.estado)?'Estamos revisando tu abono. Te avisaremos cuando termine la verificación.':'Tu pedido está registrado. Revisaremos el abono antes de prepararlo. Puedes cerrar esta página.';
 document.getElementById('content').className='';document.getElementById('content').innerHTML=`<section class="card"><span class="badge ${paid?'paid':''}">${E(o.estado)}</span><h2>${E(o.codigo)}</h2><p class="status-copy">${E(statusText)}</p><button class="btn ghost" id="refreshOrder">Actualizar estado</button><small>Se actualiza cada 30 segundos mientras esta página está visible.</small></section><section class="grid" style="margin-top:18px"><div class="card"><h2>Resumen de compra</h2><div class="line"><span>Productos</span><b>${M(o.subtotal_usd||o.total_usd)}</b></div>${o.discount_usd?`<div class="line success"><span>Descuento ${Number(o.discount_value||20)}%</span><b>−${M(o.discount_usd)}</b></div>`:''}<div class="line total"><span>Total productos</span><b>${M(o.total_usd)}</b></div><p class="note">El envío se coordina y paga por separado.</p><ul class="items">${o.items.map(i=>`<li><b>${E(i.producto)} × ${Number(i.cantidad)}</b><span>${E([i.color,i.capacidad].filter(Boolean).join(' · '))}</span></li>`).join('')}</ul></div><div class="card"><h2>Pago y entrega</h2><div class="line"><span>Método</span><b>${E(o.metodo_pago)}</b></div><div class="line"><span>Referencia</span><b>${E(o.referencia_pago||'Pendiente')}</b></div><div class="line"><span>Entrega</span><b>${E(o.metodo_envio)}</b></div><div class="line"><span>Empresa</span><b>${E(o.empresa_envio||'ThinkStore')}</b></div><div class="line"><span>Guía</span><b>${E(o.numero_guia||'Por asignar')}</b></div><h2>Nota de entrega</h2><p>${paid?'El pago está confirmado. La nota definitiva se habilita al completar la asignación de tus productos.':'La nota queda pendiente hasta verificar el pago y asignar tus productos.'}</p>${paid?'<button id="viewNote" class="btn ghost">Consultar nota de entrega</button>':''}</div></section>${locked?'':`<section class="card"><h2>¿Ya realizaste el pago?</h2><p>Reporta la referencia y adjunta el comprobante si lo tienes. ThinkStore comprobará el abono por su cuenta.</p><form id="reportForm"><label>Referencia o número de transacción<input id="reference" minlength="3" maxlength="160" value="${E(o.referencia_pago||'')}" required></label><label>Comprobante opcional<input id="receipt" type="file" accept="image/png,image/jpeg,application/pdf"></label><button class="btn" id="reportBtn">Reportar pago</button></form><small>Para Binance o USDT, confirma los datos receptores con nosotros antes de transferir.</small></section>`}<section class="card"><h2>Estamos para ayudarte.</h2><a class="btn ghost" target="_blank" rel="noopener" href="https://wa.me/584241706142?text=${encodeURIComponent('Hola ThinkStore, consulto por el pedido '+o.codigo)}">Consultar por WhatsApp ↗</a><a class="btn ghost" href="/">Seguir comprando</a></section>`;
 document.getElementById('refreshOrder').onclick=load;document.getElementById('reportForm')?.addEventListener('submit',report);if(document.getElementById('viewNote'))document.getElementById('viewNote').onclick=async()=>{const w=window.open('','_blank');try{const d=await call('view_delivery_note');if(w){w.document.write(d.html);w.document.close();}}catch(e){w?.close();document.getElementById('feedback').textContent=e.message;}};
 }
 async function report(e){e.preventDefault();if(sending)return;sending=true;document.getElementById('reportBtn').disabled=true;try{const file=document.getElementById('receipt').files?.[0],ref=document.getElementById('reference').value.trim();if(file&&(file.size>8*1024*1024||!['image/png','image/jpeg','application/pdf'].includes(file.type)))throw Error('Usa PNG, JPG o PDF de hasta 8 MB.');await call('report_payment',{reference:ref});if(file){const session=(await sb.auth.getSession())?.data?.session,path=`private/${session.user.id}/${order.id}-${Date.now()}.${file.type==='application/pdf'?'pdf':file.type==='image/png'?'png':'jpg'}`;const up=await sb.storage.from('comprobantes').upload(path,file,{contentType:file.type,upsert:false});if(up.error)throw Error('Referencia guardada. No se pudo adjuntar el archivo; inténtalo nuevamente.');const row=await sb.from('comprobantes').insert({pedido_id:order.id,cliente_id:session.user.id,url_archivo:path,referencia:ref,monto:Number(order.metodo_pago==='Pago Móvil'?order.total_bs:order.total_usd)});if(row.error)throw Error('Referencia guardada; el comprobante quedó pendiente de sincronizar.');}document.getElementById('feedback').textContent='Pago reportado. Recibirás la actualización cuando revisemos el abono.';}catch(err){document.getElementById('feedback').textContent=err.message;}finally{sending=false;document.getElementById('reportBtn')&&(document.getElementById('reportBtn').disabled=false);}}
 load();setInterval(load,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load();});
})();
</script></body></html>
