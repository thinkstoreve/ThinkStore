<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0c0c0f" />
  <title>Crear contraseña · ThinkStore Inventory</title>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#111114;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.wrap{min-height:100vh;display:grid;place-items:center;padding:28px}.card{width:min(620px,100%);background:#fff;border:1px solid #dedee3;border-radius:30px;padding:42px;box-shadow:0 26px 80px rgba(0,0,0,.08)}.logo{width:76px;height:76px;border-radius:20px;display:block}.kicker{margin-top:28px;text-transform:uppercase;letter-spacing:2.5px;color:#81818a;font-weight:800;font-size:13px}.card h1{font-size:40px;line-height:1.08;margin:12px 0}.lead{font-size:18px;line-height:1.55;color:#65656e;margin:0 0 24px}.account{padding:16px 18px;background:#f6f6f8;border-radius:16px;margin:18px 0 24px}.account small{display:block;text-transform:uppercase;letter-spacing:1.2px;color:#888891;font-weight:750;margin-bottom:5px}.account b{font-size:17px;word-break:break-all}.field{display:block;margin-top:17px;font-weight:750;color:#4e4e56}.field input{width:100%;margin-top:8px;border:1px solid #d7d7dc;border-radius:15px;padding:15px 16px;font:inherit;font-weight:600;outline:none}.field input:focus{border-color:#111114;box-shadow:0 0 0 3px rgba(0,0,0,.07)}.help{display:block;font-size:13px;color:#888891;font-weight:500;margin-top:7px}.btn{width:100%;border:0;border-radius:15px;background:#111114;color:#fff;padding:16px 20px;font:inherit;font-size:17px;font-weight:800;cursor:pointer;margin-top:24px}.btn:disabled{opacity:.55;cursor:wait}.status{border-radius:14px;padding:14px 16px;margin:18px 0;font-size:14px;line-height:1.45}.status.error{background:#fff0ef;color:#a12016;border:1px solid #ffc4be}.status.ok{background:#edf9f1;color:#176a36;border:1px solid #bde6c9}.muted{text-align:center;color:#8a8a92;font-size:13px;margin:18px 0 0}.success{text-align:center;padding:10px 0}.success .logo{margin:0 auto}.success h1{font-size:34px}.success a{display:inline-block;background:#111114;color:#fff;text-decoration:none;border-radius:15px;padding:15px 22px;font-weight:800;margin-top:10px}@media(max-width:640px){.card{padding:28px 22px;border-radius:24px}.card h1{font-size:34px}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card" id="card">
      <img class="logo" src="icons/thinkstore-logo.png" alt="ThinkStore">
      <div class="kicker">ThinkStore Inventory</div>
      <h1>Crear tu contraseña</h1>
      <p class="lead">Estamos validando tu invitación de socio administrador.</p>
      <div class="status" id="status">Validando acceso seguro…</div>
    </section>
  </main>
  <script src="config.js?v=3.2.11"></script>
  <script>
  (function(){
    const card=document.getElementById('card'),status=document.getElementById('status');
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    function loadScript(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})}
    async function loadSupabase(){if(window.supabase)return true;for(const src of ['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js','https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js']){try{await loadScript(src);if(window.supabase)return true}catch{}}return false}
    function error(message){status.className='status error';status.textContent=message}
    async function init(){
      if(!await loadSupabase()){error('No pudimos cargar el servicio de acceso. Revisa tu conexión y vuelve a abrir el enlace.');return}
      const cfg=window.TS_CONFIG||{};if(!cfg.SUPABASE_URL||!cfg.SUPABASE_PUBLISHABLE_KEY){error('La configuración de ThinkStore Inventory no está disponible.');return}
      const client=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}})
      await new Promise(r=>setTimeout(r,250));
      let session=(await client.auth.getSession()).data?.session;
      if(!session){await new Promise(r=>setTimeout(r,700));session=(await client.auth.getSession()).data?.session}
      if(!session){error('Esta invitación no es válida, ya fue utilizada o expiró. Solicita una nueva invitación al administrador de ThinkStore.');return}
      const email=session.user?.email||'';
      card.innerHTML=`<img class="logo" src="icons/thinkstore-logo.png" alt="ThinkStore"><div class="kicker">ThinkStore Inventory</div><h1>Crea tu contraseña</h1><p class="lead">Bienvenido a tu nuevo panel administrador exclusivo de ThinkStore.</p><div class="account"><small>Correo corporativo de acceso</small><b>${esc(email)}</b></div><form id="passwordForm"><label class="field">Nueva contraseña<input name="password" type="password" minlength="10" autocomplete="new-password" required><span class="help">Mínimo 10 caracteres. Recomendamos combinar letras, números y símbolos.</span></label><label class="field">Confirmar contraseña<input name="confirm" type="password" minlength="10" autocomplete="new-password" required></label><div id="formStatus"></div><button class="btn" id="saveBtn">Crear contraseña y activar acceso</button></form><p class="muted">Tu contraseña se guarda de forma segura en Supabase Auth y nunca es visible para los administradores de ThinkStore.</p>`;
      document.getElementById('passwordForm').onsubmit=async ev=>{
        ev.preventDefault();const form=ev.currentTarget,p=form.password.value,c=form.confirm.value,box=document.getElementById('formStatus'),btn=document.getElementById('saveBtn');
        if(p.length<10){box.className='status error';box.textContent='La contraseña debe tener al menos 10 caracteres.';return}
        if(p!==c){box.className='status error';box.textContent='Las contraseñas no coinciden.';return}
        btn.disabled=true;btn.textContent='Guardando…';
        const {error:err}=await client.auth.updateUser({password:p});
        if(err){btn.disabled=false;btn.textContent='Crear contraseña y activar acceso';box.className='status error';box.textContent=err.message||'No pudimos guardar la contraseña.';return}
        card.innerHTML=`<div class="success"><img class="logo" src="icons/thinkstore-logo.png" alt="ThinkStore"><div class="kicker">ThinkStore Inventory</div><h1>Acceso activado</h1><p class="lead">Tu contraseña fue creada correctamente. Ya puedes entrar a tu panel administrador.</p><a href="./">Entrar a Inventory</a></div>`;
      };
    }
    init().catch(err=>error(err?.message||'No pudimos validar la invitación.'));
  })();
  </script>
</body>
</html>
