<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#0f0f10">
  <title>Seguimiento de servicio | ThinkStore</title>
  <meta name="robots" content="noindex,nofollow" />
  <style>
    :root{color-scheme:dark;--bg:#070b10;--card:#0e1620;--line:#203043;--text:#f7f9fb;--muted:#93a4b8;--blue:#2794ff;--green:#33c77a}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 10%,#12283c 0,transparent 28%),linear-gradient(145deg,#05080c,#0a1017 55%,#071018);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
    .wrap{width:min(820px,calc(100% - 28px));margin:0 auto;padding:48px 0}.brand{display:flex;align-items:center;gap:12px;margin-bottom:40px}.logo{width:48px;height:48px;border-radius:14px;background:#fff;display:grid;place-items:center;overflow:hidden}.logo img{width:100%;height:100%;object-fit:contain}.brand b{font-size:21px}.brand span{display:block;color:var(--muted);font-size:13px}.hero{text-align:center;margin-bottom:24px}.hero .eyebrow{color:#58b5ff;font-weight:800;letter-spacing:.16em;font-size:12px}.hero h1{font-size:clamp(34px,7vw,56px);line-height:1.02;margin:12px 0}.hero p{color:var(--muted);font-size:17px;line-height:1.6}
    .card{background:linear-gradient(180deg,rgba(18,27,38,.95),rgba(11,18,26,.96));border:1px solid rgba(255,255,255,.09);border-radius:28px;padding:24px;box-shadow:0 28px 80px rgba(0,0,0,.32);margin-bottom:16px}form.lookup{display:flex;gap:10px}input,textarea{border:1px solid var(--line);background:#08111a;color:#fff;border-radius:14px;padding:15px 16px;font:inherit}form.lookup input{flex:1;text-transform:uppercase}button{border:0;border-radius:14px;background:var(--blue);color:#fff;font-weight:750;padding:15px 20px;cursor:pointer}.result{display:none;margin-top:24px}.result.show{display:block}.statusline{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;padding-bottom:18px;border-bottom:1px solid var(--line)}.status-pill{background:rgba(51,199,122,.13);border:1px solid rgba(51,199,122,.35);color:#7ae5a7;border-radius:999px;padding:7px 11px;font-size:13px;font-weight:750}.order-code{font-size:25px;margin:6px 0}.device{color:var(--muted)}.timeline{margin:24px 0 4px;display:grid;gap:0}.step{display:grid;grid-template-columns:28px 1fr;gap:14px;position:relative;padding-bottom:24px}.step:not(:last-child):before{content:"";position:absolute;left:13px;top:26px;bottom:0;width:2px;background:#263548}.dot{width:28px;height:28px;border-radius:50%;border:2px solid #33465b;background:#0b131c;display:grid;place-items:center;font-size:12px;z-index:1}.step.done .dot{border-color:var(--green);background:var(--green);color:#07140d}.step.current .dot{border-color:var(--blue);box-shadow:0 0 0 5px rgba(39,148,255,.12)}.step b{display:block;margin-top:3px}.step small{color:var(--muted);display:block;margin-top:4px}.last-update{margin-top:18px;color:var(--muted);font-size:13px;text-align:center}.error{display:none;margin-top:18px;padding:14px;border:1px solid rgba(255,90,90,.35);background:rgba(255,90,90,.08);border-radius:14px;color:#ffaaaa}.error.show{display:block}.foot{text-align:center;margin-top:28px;color:var(--muted);font-size:12px}
    .secure-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.secure-box{border:1px solid var(--line);border-radius:16px;padding:14px;background:#09121b}.secure-box small{display:block;color:var(--muted);margin-bottom:4px}.secure-box b{font-size:14px}.portal-section{margin-top:18px;border-top:1px solid var(--line);padding-top:18px}.portal-section h3{margin:0 0 12px}.updates{display:grid;gap:9px}.update{background:#09121b;border:1px solid var(--line);border-radius:14px;padding:12px}.update b{display:block}.update p{margin:5px 0;color:#d7e0e9}.update small{color:var(--muted)}
    .chat-thread{max-height:390px;overflow:auto;display:flex;flex-direction:column;gap:9px;padding:12px;background:#081019;border:1px solid var(--line);border-radius:18px}.chat-row{display:flex}.chat-row.staff{justify-content:flex-start}.chat-row.client{justify-content:flex-end}.bubble{max-width:82%;padding:10px 13px;border-radius:18px}.chat-row.staff .bubble{background:#1a2633;border-bottom-left-radius:6px}.chat-row.client .bubble{background:#1677ff;border-bottom-right-radius:6px}.bubble small{display:block;font-size:10px;opacity:.7;font-weight:800}.bubble p{margin:4px 0;white-space:pre-wrap;overflow-wrap:anywhere}.bubble em{display:block;font-style:normal;font-size:9px;opacity:.65}.chat-form{display:grid;grid-template-columns:1fr auto;gap:9px;margin-top:10px}.chat-form textarea{min-height:54px;resize:vertical}.hidden{display:none!important}
    @media(max-width:600px){.wrap{padding-top:26px}.brand{margin-bottom:28px}form.lookup{flex-direction:column}.statusline{flex-direction:column}.card{padding:18px;border-radius:22px}.secure-grid{grid-template-columns:1fr}.chat-form{grid-template-columns:1fr}.chat-form button{width:100%}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand"><div class="logo"><img src="/assets/logo-thinkstore-email-transparent.png" alt="ThinkStore"></div><div><b>ThinkStore</b><span>Servicio Técnico</span></div></div>
    <section class="hero"><div class="eyebrow">SEGUIMIENTO EN VIVO</div><h1>Consulta tu equipo</h1><p>Revisa el estado de tu reparación y, desde el enlace seguro de tu orden, conversa directamente con ThinkStore.</p></section>
    <section class="card">
      <form id="lookup" class="lookup"><input id="code" required placeholder="TS-SVC-2026-0001" autocomplete="off"/><button>Consultar</button></form>
      <div id="error" class="error"></div>
      <div id="result" class="result">
        <div class="statusline"><div><div class="order-code" id="orderCode"></div><div class="device" id="device"></div></div><span class="status-pill" id="status"></span></div>
        <div id="secureMeta" class="secure-grid hidden"></div>
        <div class="timeline" id="timeline"></div>
        <div id="updatesSection" class="portal-section hidden"><h3>Actualizaciones de la reparación</h3><div id="updates" class="updates"></div></div>
        <div id="chatSection" class="portal-section hidden"><h3>Mensajes con ThinkStore</h3><div id="chatThread" class="chat-thread"></div><form id="chatForm" class="chat-form"><textarea id="chatMessage" maxlength="2000" required placeholder="Escribe un mensaje a nuestro equipo técnico…"></textarea><button>Enviar</button></form></div>
        <div class="last-update" id="updated"></div>
      </div>
    </section>
    <div class="foot">ThinkStore · Tecnología. Todo en un solo lugar.</div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const sb=window.supabase.createClient('https://tnezvnziqnjxhcwjtcuy.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ0bmV6dm56aXFuanhoa3dqdGN1eSIsInJlZiI6InRuZXp2bnppcW5qeGhjd2p0Y3V5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwODk5ODUsImV4cCI6MjA5NzY2NTk4NX0.OsFkefVeW4FN_uVML1ncE0i6FR_Dmg8eLPY9TEnezpM');
    let liveTimer=null,lastCode='',secureToken='';
    const steps=['Solicitud web','Recibido','En diagnóstico','Cotización enviada','Aprobado por cliente','En reparación','Esperando repuesto','Listo para entregar','Entregado'];
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const date=v=>v?new Date(v).toLocaleString('es-VE'):'—';
    function renderTimeline(current){let idx=steps.indexOf(String(current||'Recibido'));if(idx<0){if(current==='No aprobado'||current==='Cancelado')idx=1;else idx=0}document.getElementById('timeline').innerHTML=steps.map((s,i)=>`<div class="step ${i<idx?'done':i===idx?'current':''}"><span class="dot">${i<idx?'✓':i+1}</span><div><b>${s}</b><small>${i===idx?'Estado actual':i<idx?'Completado':'Pendiente'}</small></div></div>`).join('')}
    function showError(message){const e=document.getElementById('error');e.textContent=message;e.classList.add('show');document.getElementById('result').classList.remove('show')}
    function showBase(o){document.getElementById('error').classList.remove('show');document.getElementById('orderCode').textContent=o.code;document.getElementById('device').textContent=o.device_model||'Equipo';document.getElementById('status').textContent=o.status||'Recibido';document.getElementById('updated').textContent='Última actualización: '+date(o.updated_at)+' · actualización automática cada 15 s';renderTimeline(o.status);document.getElementById('result').classList.add('show')}
    async function runLookup(value){const q=String(value||'').trim().toUpperCase();if(!q)return;lastCode=q;secureToken='';document.getElementById('secureMeta').classList.add('hidden');document.getElementById('updatesSection').classList.add('hidden');document.getElementById('chatSection').classList.add('hidden');const {data,error}=await sb.rpc('lookup_service_order',{p_code:q});const o=Array.isArray(data)?data[0]:data;if(error||!o)return showError('No encontramos una orden con ese número. Verifica el código e inténtalo de nuevo.');showBase(o);clearInterval(liveTimer);liveTimer=setInterval(()=>{if(lastCode&&!secureToken)runLookup(lastCode)},15000)}
    function renderSecure(data){const o=data.order;showBase(o);document.getElementById('lookup').classList.add('hidden');document.getElementById('secureMeta').innerHTML=`<div class="secure-box"><small>Cliente</small><b>${esc(o.client_name||'Cliente')}</b></div><div class="secure-box"><small>Serial / IMEI</small><b>${esc(o.serial_imei||'No indicado')}</b></div><div class="secure-box"><small>Presupuesto</small><b>${o.quote_amount?esc((o.quote_currency||'USD')+' '+Number(o.quote_amount).toFixed(2)):'Pendiente'}</b></div><div class="secure-box"><small>Garantía</small><b>${Number(o.warranty_days||0)} día(s)</b></div>`;document.getElementById('secureMeta').classList.remove('hidden');const notes=data.notes||[];document.getElementById('updates').innerHTML=notes.length?notes.map(n=>`<div class="update"><b>${esc(n.client_title||n.work_performed||n.note||'Actualización')}</b>${n.diagnosis?`<p>${esc(n.diagnosis)}</p>`:''}${n.work_performed?`<p>${esc(n.work_performed)}</p>`:''}${n.client_notes?`<p>${esc(n.client_notes)}</p>`:''}<small>${esc(date(n.created_at))}</small></div>`).join(''):'<div class="update"><b>Seguimiento activo</b><p>Aún no hay actualizaciones públicas adicionales.</p></div>';document.getElementById('updatesSection').classList.remove('hidden');renderChat(data.messages||[]);document.getElementById('chatSection').classList.remove('hidden')}
    function renderChat(messages){const t=document.getElementById('chatThread');t.innerHTML=messages.length?messages.map(m=>`<div class="chat-row ${m.sender_type==='client'?'client':'staff'}"><div class="bubble"><small>${esc(m.sender_name||(m.sender_type==='client'?'Cliente':'ThinkStore'))}</small><p>${esc(m.message)}</p><em>${esc(date(m.created_at))}</em></div></div>`).join(''):'<div class="update"><b>Sin mensajes todavía</b><p>Puedes escribirnos desde aquí.</p></div>';requestAnimationFrame(()=>t.scrollTop=t.scrollHeight)}
    async function runSecure(token){secureToken=token;lastCode='';try{const r=await fetch('/.netlify/functions/support-client-portal?token='+encodeURIComponent(token),{cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw Error(d.error||'No se pudo abrir el seguimiento');renderSecure(d);clearInterval(liveTimer);liveTimer=setInterval(()=>runSecure(token),15000)}catch(e){showError(e.message||'El enlace de seguimiento no es válido')}}
    document.getElementById('lookup').addEventListener('submit',e=>{e.preventDefault();runLookup(document.getElementById('code').value)});
    document.getElementById('chatForm').addEventListener('submit',async e=>{e.preventDefault();if(!secureToken)return;const input=document.getElementById('chatMessage'),message=input.value.trim();if(!message)return;const btn=e.submitter;btn.disabled=true;btn.textContent='Enviando…';try{const r=await fetch('/.netlify/functions/support-client-portal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'send_message',token:secureToken,message})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw Error(d.error||'No se pudo enviar');input.value='';await runSecure(secureToken)}catch(err){alert(err.message||'No se pudo enviar el mensaje')}finally{btn.disabled=false;btn.textContent='Enviar'}});
    const params=new URLSearchParams(location.search),token=params.get('token'),initial=params.get('orden');if(token)runSecure(token);else if(initial){document.getElementById('code').value=initial;runLookup(initial)}
  </script>
</body>
</html>
