<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Accediendo al panel de Soporte | ThinkStore</title>
<meta http-equiv="refresh" content="0;url=./panel.html">
<style>body{font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;background:#f7f7f8;color:#252525}main{padding:28px;text-align:center}a{color:#1565d8}</style>
</head><body><main><p>Abriendo el panel de Soporte…</p><p><a id="panelLink" href="./panel.html">Entrar al panel</a></p></main>
<script>
(function(){
  var target = new URL('./panel.html', window.location.href);
  target.search = window.location.search;
  target.hash = window.location.hash;
  document.getElementById('panelLink').href = target.href;
  if (window.location.pathname !== target.pathname) window.location.replace(target.href);
})();
</script></body></html>
