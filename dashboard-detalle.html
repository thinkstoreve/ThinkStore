<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Detalle Dashboard · ThinkStore</title>
<link rel="icon" href="logo-thinkstore.png">
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--muted:#6e6e73;--line:#e5e5ea;--blue:#0071e3}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif;opacity:0;transform:translateY(12px);animation:pageIn .48s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes pageIn{to{opacity:1;transform:none}}@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.top{position:sticky;top:0;z-index:20;background:rgba(245,245,247,.86);backdrop-filter:blur(24px);border-bottom:1px solid rgba(0,0,0,.06)}
.topin{max-width:1180px;margin:auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:850}.brand img{width:42px;height:42px;border-radius:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:#111;padding:10px 14px;border-radius:999px;text-decoration:none;font-weight:760;cursor:pointer}.btn.primary{background:#111;color:#fff;border-color:#111}
.wrap{max-width:1180px;margin:28px auto;padding:0 18px 48px}.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px}.eyebrow{text-transform:uppercase;letter-spacing:1.7px;font-size:11px;color:#0071e3;font-weight:850}.hero h1{font-size:clamp(34px,5vw,56px);letter-spacing:-1.8px;line-height:1;margin:8px 0}.hero p{margin:0;color:var(--muted);font-size:16px}.count{font-size:46px;font-weight:900;letter-spacing:-1.5px}
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0 22px}.summary .box{background:#111;color:#fff;border-radius:22px;padding:18px;min-height:105px}.summary small{color:#c7c7cc}.summary strong{display:block;font-size:28px;margin-top:8px}
.toolbar{display:flex;gap:10px;margin:0 0 16px;flex-wrap:wrap}.toolbar input{flex:1;min-width:240px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;font:inherit;outline:none}.toolbar input:focus{border-color:#9ec7f4;box-shadow:0 0 0 4px rgba(0,113,227,.08)}
.list{display:grid;gap:12px}.item{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 10px 28px rgba(0,0,0,.035);animation:cardIn .45s both;transition:.2s}.item:hover{transform:translateY(-2px);box-shadow:0 18px 42px rgba(0,0,0,.07)}
.itemtop{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.item h3{margin:0;font-size:19px}.meta{color:var(--muted);font-size:13px;line-height:1.55;margin-top:5px}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:6px 10px;background:#f5f5f7;font-size:11px;font-weight:800;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}.field{padding:12px;background:#f8f8fa;border-radius:14px;min-width:0}.field small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}.field b{display:block;overflow-wrap:anywhere}.empty{text-align:center;background:#fff;border:1px dashed #d2d2d7;border-radius:24px;padding:55px 20px;color:var(--muted)}
.receipt{display:flex;gap:12px;align-items:center}.receipt img{width:70px;height:70px;object-fit:cover;border-radius:14px;background:#f3f3f3}
.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:30px}
@media(max-width:820px){.summary{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.hero{align-items:flex-start;flex-direction:column}.count{font-size:34px}}
@media(max-width:520px){.grid{grid-template-columns:1fr}.topin{align-items:flex-start}.itemtop{flex-direction:column}}
@media(prefers-reduced-motion:reduce){body,.item{animation:none!important;opacity:1;transform:none}}
</style>
</head>
<body>
<header class="top"><div class="topin"><div class="brand"><img src="logo-thinkstore.png" alt="ThinkStore"><span>ThinkStore · Dashboard</span></div><div class="actions"><a class="btn" href="panel.html#dashboard">Volver al panel</a><button class="btn primary" onclick="window.close()">Cerrar ventana</button></div></div></header>
<main class="wrap">
  <section class="hero"><div><div class="eyebrow">Datos reales</div><h1 id="title">Detalle</h1><p id="subtitle">Información del panel ThinkStore.</p></div><div class="count" id="count">0</div></section>
  <section class="summary" id="summary"></section>
  <div class="toolbar"><input id="search" placeholder="Buscar dentro de estos resultados…" oninput="render()"></div>
  <section class="list" id="list"></section>
  <div class="footer" id="updated"></div>
</main>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])),money=n=>'$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const params=new URLSearchParams(location.search),view=params.get('view')||'orders';
let snap={};try{snap=JSON.parse(localStorage.getItem('ts_dashboard_snapshot')||'{}')}catch{}
const cfg={
 orders:{title:'Pedidos reales',subtitle:'Todos los pedidos registrados en ThinkStore.',key:'orders',icon:'📦'},
 clients:{title:'Clientes registrados',subtitle:'Clientes disponibles en la base real de ThinkStore.',key:'customers',icon:'👥'},
 payments:{title:'Pagos por revisar',subtitle:'Pedidos que requieren validación de pago.',key:'pending',icon:'💳'},
 receipts:{title:'Comprobantes cargados',subtitle:'Soportes de pago recibidos para revisión.',key:'receipts',icon:'🧾'},
 preorders:{title:'Preórdenes y tránsito',subtitle:'Pedidos en compra a proveedor o tránsito.',key:'preorders',icon:'⏳'},
 shipping:{title:'Envíos y entregas',subtitle:'Pedidos que ya están dentro del flujo logístico.',key:'shipping',icon:'🚚'},
 paid:{title:'Ventas con pago validado',subtitle:'Pedidos cuyo pago ya fue validado.',key:'paid',icon:'💰'},
 newclients:{title:'Clientes nuevos',subtitle:'Altas registradas durante los últimos 30 días.',key:'newclients',icon:'✨'}
}[view]||null;
function client(o){const c=o?.clientes||o?.customer||{};return{name:c.nombre||c.name||o?.guest_name||o?.customer_name||'Cliente',email:c.correo||c.email||o?.guest_email||o?.customer_email||'',phone:c.telefono||c.phone||o?.guest_phone||''}}
function status(o){return o?.estado||o?.status||'Por confirmar'}function code(o){return o?.codigo||o?.code||o?.pedido_codigo||'—'}function total(o){return Number(o?.total_usd||o?.total||o?.monto||0)}
function dt(v){if(!v)return'—';const d=new Date(v);return isNaN(d)?String(v):d.toLocaleString('es-VE',{dateStyle:'short',timeStyle:'short',timeZone:'America/Caracas'})}
function summary(rows){
 const amt=rows.reduce((n,x)=>n+total(x),0);const today=new Date().toLocaleDateString('es-VE',{timeZone:'America/Caracas'});
 $('summary').innerHTML=`<div class="box"><small>Resultados</small><strong>${rows.length}</strong></div><div class="box"><small>Monto relacionado</small><strong>${money(amt)}</strong></div><div class="box"><small>Consulta</small><strong style="font-size:17px">${esc(today)}</strong></div>`;
}
function renderOrder(o,i){const c=client(o);return `<article class="item" style="animation-delay:${Math.min(i*35,350)}ms"><div class="itemtop"><div><h3>${esc(code(o))}</h3><div class="meta">${esc(c.name)} · ${esc(c.email)}<br>${esc(dt(o.created_at||o.date))}</div></div><span class="badge">${esc(status(o))}</span></div><div class="grid"><div class="field"><small>Total</small><b>${money(total(o))}</b></div><div class="field"><small>Pago</small><b>${esc(o.metodo_pago||o.payment||'Por confirmar')}</b></div><div class="field"><small>Entrega</small><b>${esc(o.empresa_envio||o.shippingCompany||o.metodo_envio||'Por confirmar')}</b></div><div class="field"><small>Teléfono</small><b>${esc(c.phone||'—')}</b></div></div></article>`}
function renderClient(c,i){return `<article class="item" style="animation-delay:${Math.min(i*35,350)}ms"><div class="itemtop"><div><h3>${esc(c.nombre||c.name||c.full_name||'Cliente')}</h3><div class="meta">${esc(c.correo||c.email||'')} · ${esc(c.telefono||c.phone||'')}</div></div><span class="badge">Cliente</span></div><div class="grid"><div class="field"><small>Documento</small><b>${esc(c.cedula_rif||c.document||'—')}</b></div><div class="field"><small>Ciudad</small><b>${esc(c.ciudad||c.city||'—')}</b></div><div class="field"><small>Estado</small><b>${esc(c.estado||c.state||'—')}</b></div><div class="field"><small>Registro</small><b>${esc(dt(c.created_at))}</b></div></div></article>`}
function renderReceipt(r,i){return `<article class="item" style="animation-delay:${Math.min(i*35,350)}ms"><div class="itemtop"><div><h3>${esc(r.pedido_codigo||r.codigo||r.referencia||'Comprobante')}</h3><div class="meta">Referencia: ${esc(r.referencia||r.reference||'—')} · ${esc(dt(r.created_at))}</div></div><span class="badge">Comprobante</span></div><div class="grid"><div class="field"><small>Monto</small><b>${money(r.monto||r.amount||0)}</b></div><div class="field"><small>Método</small><b>${esc(r.metodo_pago||r.payment_method||'—')}</b></div><div class="field"><small>Estado</small><b>${esc(r.estado||r.status||'Pendiente')}</b></div><div class="field"><small>Correo</small><b>${esc(r.correo||r.email||'—')}</b></div></div></article>`}
function render(){
 if(!cfg){$('title').textContent='Vista no disponible';return}
 const source=Array.isArray(snap[cfg.key])?snap[cfg.key]:[],q=$('search').value.trim().toLowerCase(),rows=source.filter(x=>!q||JSON.stringify(x).toLowerCase().includes(q));
 $('title').textContent=cfg.title;$('subtitle').textContent=cfg.subtitle;$('count').textContent=rows.length;summary(rows);
 $('list').innerHTML=rows.map((x,i)=>view==='clients'||view==='newclients'?renderClient(x,i):view==='receipts'?renderReceipt(x,i):renderOrder(x,i)).join('')||'<div class="empty">No hay resultados para mostrar en esta categoría.</div>';
 $('updated').textContent=snap.created_at?'Snapshot actualizado: '+dt(snap.created_at):'Abre el Dashboard nuevamente para actualizar estos datos.';
}
render();
</script>
</body>
</html>
