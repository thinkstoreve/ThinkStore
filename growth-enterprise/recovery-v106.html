<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recuperando Enterprise</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07111f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.c{width:min(88vw,560px);padding:38px;border:1px solid #ffffff26;border-radius:28px;background:#0d1c2e}h1{font-size:42px;margin:0 0 14px}p{color:#b9c7db;line-height:1.6}.pill{display:inline-block;padding:8px 12px;border-radius:999px;background:#103663;color:#8dbdff;font-weight:800;letter-spacing:.08em}</style></head><body><div class="c"><span class="pill">ENTERPRISE V10.6</span><h1>Recuperando acceso</h1><p id="m">Eliminando la versión offline anterior y abriendo Enterprise en modo online.</p></div><script>(async()=>{try{if('serviceWorker'in navigator){const r=await navigator.serviceWorker.getRegistrations();await Promise.all(r.map(x=>x.unregister().catch(()=>false)))}if('caches'in window){const k=await caches.keys();await Promise.all(k.map(x=>caches.delete(x)))}try{localStorage.removeItem('thinkstore_pwa_banner_dismissed');sessionStorage.clear()}catch{}document.getElementById('m').textContent='Listo. Abriendo ThinkStore Enterprise…';setTimeout(()=>location.replace('/?recovered=106&ts='+Date.now()),700)}catch(e){document.getElementById('m').textContent='Pulsa recargar para continuar: '+(e.message||e)} })();</script></body></html>
