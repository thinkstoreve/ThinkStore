<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0f0f10">
  <title>ThinkStore Enterprise · Sin conexión</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <section class="lock-screen">
    <div class="aurora"></div>
    <div class="lock-card">
      <img src="assets/thinkstore-logo-white.png" alt="ThinkStore" class="lock-logo" />
      <span class="pill">Modo offline</span>
      <h1>Sin conexión</h1>
      <p>ThinkStore Enterprise necesita internet para consultar Supabase y mostrar datos reales. Revisa tu conexión y vuelve a intentarlo.</p>
      <button class="logout" onclick="location.reload()">Reintentar</button>
    </div>
  </section>
</body>
</html>
