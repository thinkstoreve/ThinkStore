<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recuperando ThinkStore Enterprise</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07111f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.c{width:min(88vw,560px);padding:38px;border:1px solid #ffffff26;border-radius:28px;background:#0d1c2e}h1{font-size:40px;margin:0 0 14px}p{color:#b9c7db;line-height:1.6}.pill{display:inline-block;padding:8px 12px;border-radius:999px;background:#103663;color:#8dbdff;font-weight:800;letter-spacing:.08em}</style></head><body><div class="c"><span class="pill">ENTERPRISE V10.13</span><h1>Recuperando acceso</h1><p id="m">Limpiando la versión offline anterior y conectando Enterprise.</p></div><script>(async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.filter(r=>r.scope.includes('/growth-enterprise/')||(location.hostname.startsWith('enterprise.')&&new URL(r.scope).pathname==='/')).map(r=>r.unregister().catch(()=>false)))}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('thinkstore-enterprise-')).map(k=>caches.delete(k)))}try{localStorage.removeItem('thinkstore_pwa_banner_dismissed');sessionStorage.clear()}catch(e){}document.getElementById('m').textContent='Listo. Abriendo ThinkStore Enterprise…';setTimeout(()=>location.replace('/growth-enterprise/?recovered=1491&ts='+Date.now()),600)}catch(e){document.getElementById('m').textContent='Recarga la página para continuar.'}})();</script></body></html>
