<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Ficha del pedido · ThinkStore</title><link rel="icon" href="logo-thinkstore.png"><style>
:root{--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--muted:#6e6e73;--line:#e5e5ea;--blue:#0071e3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif;color:var(--text);opacity:0;transform:translateY(12px);animation:in .42s cubic-bezier(.2,.8,.2,1) forwards}@keyframes in{to{opacity:1;transform:none}}
.top{position:sticky;top:0;background:rgba(245,245,247,.88);backdrop-filter:blur(22px);border-bottom:1px solid var(--line);z-index:5}.topin{max-width:1160px;margin:auto;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-weight:850}.brand img{width:42px;height:42px}.btn{border:1px solid var(--line);background:#fff;color:#111;border-radius:999px;padding:10px 14px;text-decoration:none;font-weight:760;cursor:pointer}.btn.dark{background:#111;color:#fff;border-color:#111}
.wrap{max-width:1160px;margin:28px auto;padding:0 18px 50px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-end}.eyebrow{font-size:11px;letter-spacing:1.6px;color:var(--blue);font-weight:850}.hero h1{font-size:clamp(34px,5vw,54px);margin:8px 0 6px;letter-spacing:-1.5px}.muted{color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.kpi{background:#111;color:#fff;padding:18px;border-radius:22px}.kpi small{color:#c7c7cc}.kpi b{display:block;font-size:22px;margin-top:7px;overflow-wrap:anywhere}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 12px 30px rgba(0,0,0,.04)}.card h2{margin:0 0 14px}.row{display:grid;grid-template-columns:150px 1fr;gap:8px;padding:7px 0;border-bottom:1px solid #f1f1f3}.row:last-child{border:0}.row span:first-child{color:var(--muted)}
.items{display:grid;gap:10px}.item{display:grid;grid-template-columns:74px 1fr auto;gap:14px;align-items:start;padding:12px;border:1px solid var(--line);border-radius:16px}.item img{width:74px;height:74px;object-fit:contain;background:#fafafa;border-radius:12px}.item h3{margin:0 0 5px}.timeline{display:grid;gap:10px}.tl{display:grid;grid-template-columns:12px 1fr;gap:10px}.dot{width:10px;height:10px;border-radius:50%;background:#111;margin-top:6px}
@media(max-width:800px){.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.hero{flex-direction:column;align-items:flex-start}}@media(max-width:520px){.kpis{grid-template-columns:1fr}.row{grid-template-columns:1fr}.item{grid-template-columns:1fr}.item img{width:100%;height:120px}}
</style></head><body><header class="top"><div class="topin"><div class="brand"><img src="logo-thinkstore.png"><span>ThinkStore · Pedido</span></div><div><a class="btn" href="panel.html#pedidos">Volver al panel</a> <button class="btn dark" onclick="window.close()">Cerrar</button></div></div></header><main class="wrap"><div id="app"></div></main><script>
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])),money=n=>'$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),dt=v=>{const d=new Date(v);return isNaN(d)?String(v||'—'):d.toLocaleString('es-VE',{dateStyle:'medium',timeStyle:'short',timeZone:'America/Caracas'})};
let snap={};try{snap=JSON.parse(localStorage.getItem('ts_order_detail_snapshot')||'{}')}catch{}const o=snap.order||{},r=snap.receipt||{},c=o.customer||o.clientes||{},items=o.items||o.pedido_items||[];
const code=o.code||o.codigo||new URLSearchParams(location.search).get('code')||'Pedido';const status=o.status||o.estado||'Por confirmar',total=Number(o.total_usd||o.total||0),channel=String(o.order_channel||'online').toLowerCase()==='presencial'?'Venta presencial':'Venta online';
const rows=(arr)=>arr.map(([a,b])=>`<div class="row"><span>${esc(a)}</span><b>${esc(b||'—')}</b></div>`).join('');
const itemHtml=items.map(i=>{const name=i.product||i.producto||i.name||'Producto',img=i.image_url||'',qty=Number(i.qty||i.cantidad||1),price=Number(i.price||i.precio_usd||0);return `<article class="item">${img?`<img src="${esc(img)}">`:''}<div><h3>${esc(name)}</h3><div class="muted">${esc([i.color,i.capacity||i.capacidad,i.condition||i.condicion,i.model_code].filter(Boolean).join(' · '))}</div><div>Serie: <b>${esc(i.numero_serie||i.serial_number||'—')}</b></div>${i.garantia_dias||i.warranty_days?`<div>Garantía: <b>${Number(i.garantia_dias||i.warranty_days)} días</b></div>`:''}${i.features?`<div class="muted">${esc(i.features)}</div>`:''}</div><b>${qty} × ${money(price)}</b></article>`}).join('')||'<div class="muted">Sin productos.</div>';
const history=(o.history||o.order_status_history||[]).slice().sort((a,b)=>Date.parse(b.created_at||0)-Date.parse(a.created_at||0)).map(x=>`<div class="tl"><span class="dot"></span><div><b>${esc(x.estado||x.status||'Actualización')}</b><div class="muted">${esc(dt(x.created_at))}</div>${x.nota||x.note?`<div>${esc(x.nota||x.note)}</div>`:''}</div></div>`).join('')||'<div class="muted">Sin historial adicional.</div>';
document.getElementById('app').innerHTML=`<section class="hero"><div><div class="eyebrow">${esc(channel)}</div><h1>${esc(code)}</h1><div class="muted">${esc(dt(o.created_at||o.date))}</div></div><span class="btn dark">${esc(status)}</span></section><div class="kpis"><div class="kpi"><small>Total</small><b>${money(total)}</b></div><div class="kpi"><small>Pago</small><b>${esc(o.payment||o.metodo_pago||'Por confirmar')}</b></div><div class="kpi"><small>Entrega</small><b>${esc(o.shippingCompany||o.empresa_envio||o.metodo_envio||'Por coordinar')}</b></div><div class="kpi"><small>Comprobante</small><b>${r.id?'Recibido':'No cargado'}</b></div></div><div class="grid"><section class="card"><h2>Cliente</h2>${rows([['Nombre',c.name||c.nombre||o.guest_name],['Correo',c.email||c.correo||o.guest_email],['Teléfono',c.phone||c.telefono||o.guest_phone],['Documento',c.document||c.cedula_rif||o.guest_document],['Dirección',[c.address||c.direccion||o.guest_address,c.city||c.ciudad||o.guest_city,c.state||c.estado||o.guest_state].filter(Boolean).join(', ')]])}</section><section class="card"><h2>Pago y entrega</h2>${rows([['Método',o.payment||o.metodo_pago],['Referencia',o.paymentRef||o.referencia_pago||'No aplica'],['Guía',o.guideNumber||o.numero_guia||'Pendiente'],['Empresa',o.shippingCompany||o.empresa_envio||'—'],['Estado',status]])}</section><section class="card" style="grid-column:1/-1"><h2>Productos</h2><div class="items">${itemHtml}</div></section><section class="card"><h2>Historial</h2><div class="timeline">${history}</div></section><section class="card"><h2>Notas</h2><div>${esc(o.sale_note||o.note||o.nota||'Sin notas adicionales.')}</div></section></div>`;
</script></body></html>
