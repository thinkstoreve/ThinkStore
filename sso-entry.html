<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ThinkStore · Acceso unificado</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111}.card{width:min(92vw,520px);background:white;border:1px solid #e5e5e7;border-radius:30px;padding:34px;box-shadow:0 24px 70px rgba(0,0,0,.09);text-align:center}.logo{width:170px;max-width:65%;margin:0 auto 22px}.k{font-size:11px;letter-spacing:.16em;color:#777;text-transform:uppercase;font-weight:900}.spin{width:36px;height:36px;border:3px solid #e7e7ea;border-top-color:#111;border-radius:50%;margin:24px auto;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}h1{font-size:30px;letter-spacing:-.04em;margin:10px 0}p{color:#6e6e73;line-height:1.55}button{border:0;border-radius:999px;background:#111;color:#fff;padding:13px 20px;font-weight:800;cursor:pointer}</style></head><body><main class="card"><img class="logo" src="assets/thinkstore-email-logo.jpg" alt="ThinkStore"><div class="k">Acceso unificado</div><h1 id="title">Abriendo ThinkStore…</h1><div class="spin" id="spin"></div><p id="msg">Validando tu sesión y permisos.</p><button id="retry" hidden>Reintentar</button></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>(async()=>{const p=new URLSearchParams(location.search),platform=String(p.get('platform')||'').toLowerCase(),cfg=window.THINKSTORE_SUPABASE||{},msg=document.getElementById('msg'),title=document.getElementById('title'),retry=document.getElementById('retry');const names={staff:'App Ventas',support:'Servicio Técnico',inventory:'Inventory',enterprise:'Enterprise',marketing:'Marketing',admin:'Panel Admin'};title.textContent='Abriendo '+(names[platform]||'ThinkStore')+'…';retry.onclick=()=>location.reload();try{if(!window.supabase||!cfg.SUPABASE_URL||!cfg.SUPABASE_PUBLISHABLE_KEY)throw Error('No se pudo cargar la conexión segura.');const sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_PUBLISHABLE_KEY);const{data}=await sb.auth.getSession();if(!data?.session?.access_token){const next='sso-entry.html?platform='+encodeURIComponent(platform);location.replace('panel-login.html?next='+encodeURIComponent(next));return}const r=await fetch('/.netlify/functions/admin-sso',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+data.session.access_token},body:JSON.stringify({platform})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw Error(d.error||'No se pudo abrir esta plataforma');msg.textContent='Acceso autorizado. Redirigiendo…';location.replace(d.url)}catch(e){document.getElementById('spin').hidden=true;msg.textContent=e.message||String(e);retry.hidden=false}})();</script></body></html>
