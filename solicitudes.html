<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Solicitudes · ThinkStore</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#202024;font:15px/1.5 system-ui}main{max-width:1200px;margin:auto;padding:26px 16px}h1{font-size:34px;margin:12px 0}h2,h3,p{margin:8px 0}.muted,small{color:#6b6c75}.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}.actions{display:flex;gap:8px;flex-wrap:wrap}button,.button{font:inherit;border:1px solid #dedee4;background:#fff;color:#202024;padding:10px 14px;border-radius:12px;cursor:pointer;text-decoration:none}button.primary{background:#171719;color:#fff}button:disabled{opacity:.5;cursor:default}.card{background:white;border:1px solid #e0e1e7;border-radius:20px;padding:22px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}label{display:block;font-size:13px;color:#62636a}input,select,textarea{display:block;width:100%;padding:11px;border:1px solid #d6d6df;border-radius:10px;font:inherit;background:white;color:#202024;margin-top:5px}textarea{min-height:85px;resize:vertical}.pill{padding:5px 10px;border-radius:20px;font-size:12px;background:#eef4ff;color:#24558e}.money{font-size:23px;font-weight:650}.error{color:#a32424}.notice{background:#f1f6ff;padding:12px;border-radius:12px}pre{white-space:pre-wrap;font:13px system-ui}.row{border-top:1px solid #eee;padding:10px 0}[hidden]{display:none!important}.workflow{border-left:3px solid #167448;padding-left:12px}summary{cursor:pointer;font-weight:600}#status{min-height:25px}form .actions{margin-top:14px}@media(max-width:600px){main{padding:16px 12px}h1{font-size:28px}.card{padding:16px}.actions>*{flex:1;text-align:center}}
</style></head><body><main><header class="bar"><div><small>THINK STORE · OPERACIONES</small><h1>Solicitudes <span id="count" class="pill"></span></h1><p class="muted">Ventas, servicio técnico, citas y Think Care.</p></div><nav class="actions"><a class="button" href="/panel.html">Administración</a><a class="button" href="https://thinkstore.com.ve/staff/">App Ventas</a><a class="button" href="https://soporte.thinkstore.com.ve/panel.html">Soporte</a><a class="button" href="https://thinkstore.com.ve/growth-enterprise/index.html">Enterprise</a></nav></header><p class="notice">Una solicitud no es una orden ni un cobro. Primero se valida, se coordina con el cliente y se registra su autorización.</p><p id="status" role="status" aria-live="polite"></p><div class="grid" id="metrics"></div><section class="card bar"><div class="actions"><button id="refresh">Actualizar</button><button id="new" hidden>+ Nueva solicitud</button></div><div class="actions"><input id="search" aria-label="Buscar solicitud" placeholder="Nombre, teléfono o referencia"><select id="filter" aria-label="Filtrar por estado"><option value="">Todos los estados</option><option value="new">Nuevas</option><option value="contacted">Contactadas</option><option value="quoted">Cotizadas</option><option value="scheduled">Agendadas</option><option value="completed">Finalizadas</option><option value="cancelled">Canceladas</option><option value="linked">Con orden</option></select><select id="typeFilter" aria-label="Filtrar por servicio"><option value="">Todos los servicios</option><option value="care_all">Todo ThinkCare</option><option value="think_care">Think Care</option><option value="membership">Membresías</option><option value="technical_visit">Visitas técnicas</option><option value="sale">Ventas</option><option value="business">Empresas</option></select><select id="ownerFilter" aria-label="Filtrar por responsable"><option value="">Todos los responsables</option><option value="unassigned">Sin asignar</option></select><select id="agendaFilter" aria-label="Filtrar agenda"><option value="">Todas las fechas</option><option value="upcoming">Próximos 7 días</option><option value="overdue">Pendientes vencidas</option></select></div></section>
<form id="create" class="card" hidden><h2>Registro manual</h2><div class="grid"><label>Nombre<input name="name" required maxlength="100"></label><label>Teléfono<input name="phone" required maxlength="30"></label><label>Correo<input name="email" type="email" maxlength="200"></label><label>Tipo<select name="request_type"><option value="think_care">Think Care</option><option value="sale">Venta / producto</option><option value="support">Servicio técnico</option><option value="appointment">Cita de servicio técnico</option><option value="technical_visit">Visita técnica</option><option value="business">Empresa</option><option value="general">Consulta general</option></select></label><label>Equipo o producto<input name="device" required maxlength="100"></label><label>Dirección o zona<input name="location" maxlength="150"></label><label>Modalidad Think Care<select name="service"><option>Essential</option><option>Lab Mobile</option><option>Pickup</option><option>Business</option></select></label></div><label>Descripción<textarea name="problem" required maxlength="1500"></textarea></label><div class="actions"><button class="primary">Guardar solicitud</button><button type="button" id="cancelCreate">Cancelar</button></div></form><section id="list"></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="https://thinkstore.com.ve/care-membership-model.js?v=20261113-calendar1"></script><script src="/thinkcare-calendar.js?v=20261113-calendar1"></script><script>
const CONFIG={"main": {"url": "https://clhnndxsgzqnihhtrout.supabase.co", "key": "sb_publishable_Q7ynhCPp8nMFQywia1LqCQ_6UEAGqRZ"}, "support": {"url": "https://tnezvnziqnjxhcwjtcuy.supabase.co", "key": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRuZXp2bnppcW5qeGhjd2p0Y3V5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwODk5ODUsImV4cCI6MjA5NzY2NTk4NX0.OsFkefVeW4FN_uVML1ncE0i6FR_Dmg8eLPY9TEnezpM"}};
const isSupport=location.hostname==='soporte.thinkstore.com.ve'||location.pathname.startsWith('/soporte/');const conf=CONFIG[isSupport?'support':'main'];const sb=window.supabase.createClient(conf.url,conf.key);const endpoint='https://thinkstore.com.ve/.netlify/functions/requests-inbox';
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const labels={new:'Nueva',contacted:'Contactada',quoted:'Cotizada',scheduled:'Agendada',completed:'Finalizada',cancelled:'Cancelada'},types={think_care:'Think Care',sale:'Ventas',support:'Servicio técnico',appointment:'Cita',technical_visit:'Visita técnica',business:'Empresa',general:'Consulta'};let rows=[],team=[],canManage=false,canConvert=false,busy=false,inboxPartial=false,createId=crypto.randomUUID();const money=v=>'$'+Number(v||0).toFixed(2);const date=v=>v?new Date(v).toLocaleString('es-VE',{timeZone:'America/Caracas'}):'Sin fecha';const localTime=v=>v?new Date(new Date(v).getTime()-4*3600000).toISOString().slice(0,16):'';
function message(t,error=false){$('status').textContent=t;$('status').className=error?'error':'muted'}
async function api(method='GET',payload,query=''){const session=(await sb.auth.getSession()).data.session;if(!session)throw Error('Inicia sesión en '+(isSupport?'Soporte':'App Ventas o Administración')+' y vuelve a esta bandeja.');const r=await fetch(endpoint+query,{method,cache:'no-store',headers:{Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:payload?JSON.stringify(payload):undefined}),d=await r.json();if(!r.ok)throw Error(d.error||'No se pudo completar la operación');return d}
function metrics(){let quoted=0,paid=0,pending=0,known=true;for(const r of rows){if(!r.linked_order_id&&r.status!=='cancelled')quoted+=Number(r.quote_amount||0);if(r.linked_order_id&&!r.order)known=false;if(r.order){paid+=Number(r.order.amount_paid||0);if(!/cancel|rechaz/i.test(r.order.status||''))pending+=Math.max(0,Number(r.order.quote_amount||0)-Number(r.order.amount_paid||0))}}$('metrics').innerHTML=[['Nuevas',rows.filter(r=>r.status==='new').length,'Solicitudes por revisar'],['Cotizado sin orden',money(quoted),'Previsión comercial; no es caja'],['Cobrado en órdenes',known?money(paid):'No disponible','Importes registrados en Soporte'],['Por cobrar',known?money(pending):'No disponible','Saldos de órdenes; no es caja']].map(([a,b,c])=>`<div class="card"><small>${a}</small><div class="money">${b}</div><small>${c}</small></div>`).join('')}
function render(){const query=$('search').value.toLowerCase(),filter=$('filter').value,type=$('typeFilter').value,owner=$('ownerFilter').value,agenda=$('agendaFilter').value,now=Date.now();const selected=rows.filter(r=>(!filter||(filter==='linked'?r.linked_order_id:r.status===filter))&&(!type||(type==='care_all'?['think_care','technical_visit','business'].includes(r.request_type)||!!ThinkCareMembership.read(r.internal_note).plan:type==='membership'?!!ThinkCareMembership.read(r.internal_note).plan||/membresía/i.test(r.problem):r.request_type===type))&&(!owner||(owner==='unassigned'?!r.assigned_email:r.assigned_email===owner))&&(!agenda||(r.status==='scheduled'&&r.scheduled_at&&(agenda==='overdue'?Date.parse(r.scheduled_at)<now:Date.parse(r.scheduled_at)>=now&&Date.parse(r.scheduled_at)<=now+7*86400000)))&&[r.name,r.phone,r.device,r.id,r.linked_order_code].join(' ').toLowerCase().includes(query));$('count').textContent=rows.filter(r=>r.status==='new').length+' nuevas';$('new').hidden=!canManage;metrics();window.ThinkCareDashboard?.update(rows,{partial:inboxPartial});$('list').innerHTML=selected.map(r=>{const locked=!!r.conversion_started_at||['cancelled','completed'].includes(r.status),id=r.id;return `<article class="card" data-request="${id}"><div class="bar"><h2>${esc(r.name)} · ${esc(r.device)}</h2><span class="pill">${esc(r.order?.status||labels[r.status])}</span></div><p class="muted">${esc(types[r.request_type]||r.request_type)} · ${esc(r.source)} · ${date(r.created_at)}</p><p>${esc(r.problem)}</p><p>${esc(r.location)} · ${esc(r.phone)}</p><small>Referencia: ${id.slice(0,8).toUpperCase()}${r.scheduled_at?' · Cita: '+date(r.scheduled_at):''}</small>${r.linked_order_id?`<div class="notice"><b>Orden ${esc(r.linked_order_code)}</b><p>Cobrado: ${r.order?money(r.order.amount_paid):'No disponible'} · Gestiona recepción, reparación y cobros en Soporte.</p><a href="https://soporte.thinkstore.com.ve/panel.html?request_order=${encodeURIComponent(r.linked_order_id)}">Abrir orden de Soporte →</a></div>`:''}<details ${location.hash.slice(1)===id?'open':''}><summary>Gestionar solicitud</summary><form data-edit="${id}"><div class="grid"><label>Estado<select name="status" ${locked?'disabled':''}>${Object.entries(labels).map(([k,v])=>`<option value="${k}" ${r.status===k?'selected':''}>${v}</option>`).join('')}</select></label><label>Responsable<select name="assigned_email" ${locked?'disabled':''}><option value="">Sin asignar</option>${team.map(u=>`<option value="${esc(u.email)}" ${r.assigned_email===u.email?'selected':''}>${esc(u.nombre||u.email)}</option>`).join('')}</select></label><label>Cotización USD<input name="quote_amount" type="number" min="0" step="0.01" value="${esc(r.quote_amount??'')}" ${locked?'disabled':''}></label><label>Fecha y hora de Caracas<input name="scheduled_at" type="datetime-local" value="${localTime(r.scheduled_at)}" ${locked?'disabled':''}></label></div><p class="muted">Si cambias la gestión, registra de nuevo la autorización antes de convertir.</p><label>Detalle del presupuesto<textarea name="quote_details" maxlength="1500" ${locked?'disabled':''}>${esc(r.quote_details||'')}</textarea></label><label>Nota interna<textarea name="note" maxlength="1200" ${locked?'disabled':''}>${esc(ThinkCareMembership.read(r.internal_note).note)}</textarea></label>${membershipFields(r,locked)}${!locked&&canManage?'<button class="primary">Guardar gestión</button>':''}</form>${r.customer_approved_at?`<p class="workflow">Autorización registrada: ${date(r.customer_approved_at)}<br>${esc(r.approval_evidence)}</p>`:''}<div class="actions" style="margin-top:14px">${!locked&&canManage?`<button data-approve="${id}">Registrar autorización del cliente</button>`:''}${!r.linked_order_id&&canConvert&&['think_care','technical_visit','business','support','appointment'].includes(r.request_type)&&!['cancelled','completed'].includes(r.status)?`<button data-convert="${id}" ${!r.customer_approved_at?'disabled':''}>${r.conversion_started_at?'Recuperar conversión pendiente':'Iniciar servicio y crear orden única'}</button>`:''}${r.request_type==='sale'?'<a class="button" href="https://thinkstore.com.ve/staff/">Formalizar venta en App Ventas</a>':''}<button data-history="${id}">Ver historial</button></div>${canManage&&['think_care','technical_visit','business'].includes(r.request_type)&&r.status!=='cancelled'?`<form data-notify="${id}" class="notice" style="margin-top:16px"><h3>Actualizaciones por WhatsApp</h3><small>Requiere autorización del cliente y plantilla aprobada. Cada actualización se envía una sola vez por versión de la solicitud.</small><div class="grid"><label>Actualización<select name="stage"><option value="received">Solicitud recibida</option><option value="confirmed">Visita confirmada</option><option value="reminder">Recordatorio de visita</option><option value="assigned">Técnico asignado</option><option value="en_route">Técnico en camino</option><option value="rescheduled">Visita reprogramada</option><option value="completed">Visita finalizada</option></select></label><label>Hora estimada (solo en camino)<input name="eta" maxlength="80" placeholder="Ej. 10:30 a. m."></label></div><label>Resumen real del trabajo (solo finalizada)<textarea name="summary" maxlength="500"></textarea></label><button>Enviar actualización por WhatsApp</button></form>`:''}<div id="history-${id}" aria-live="polite"></div></details></article>`}).join('')||'<div class="card">No hay solicitudes con ese filtro.</div>'}

function membershipFields(r,locked){if(!['think_care','business','general'].includes(r.request_type))return '';const p=ThinkCareMembership.read(r.internal_note).plan||{},requested=/Solicitud de membresía ThinkCare (Empresas|Personal \/ Freelancer|PC Gamer|Gamer)/i.exec(r.problem||''),suggestedCode=requested?({empresas:'empresas','personal / freelancer':'personal',gamer:'gamer','pc gamer':'pc-gamer'}[requested[1].toLowerCase()]):'',disabled=locked||!canManage?'disabled':'';return `<fieldset style="margin:18px 0;border:1px solid #dedee4;border-radius:14px;padding:16px" ${disabled}><legend>Membresía y visitas recurrentes</legend><p class="muted">Configura las condiciones acordadas. El calendario muestra las visitas previstas y el vencimiento. Cada visita se crea como solicitud pendiente, siete días antes. No confirma citas ni genera cobros. Al desactivar el plan se detienen nuevas visitas; las solicitudes ya generadas se gestionan por separado.</p><label><input style="width:auto;display:inline" type="checkbox" name="plan_enabled" ${p.version?'checked':''}> Gestionar una membresía</label><div class="grid"><label>Plan específico<select name="plan_code"><option value="">Por identificar</option>${Object.entries(ThinkCareMembership.names).map(([id,label])=>`<option value="${id}" ${(p.code||suggestedCode)===id?'selected':''}>${esc(label)}</option>`).join('')}</select></label><label>Duración contratada<select name="plan_term"><option value="">Por definir / histórico</option>${[[1,'Mensual'],[6,'Semestral'],[12,'Anual']].map(([n,label])=>`<option value="${n}" ${p.term_months===n?'selected':''}>${label}</option>`).join('')}</select></label><label>Equipos incluidos<input name="plan_devices" type="number" min="1" max="1000" value="${esc(p.devices??'')}"></label><label>Total de visitas<input name="plan_visits" type="number" min="1" max="60" value="${esc(p.visits??'')}"></label><label>Frecuencia<select name="plan_months"><option value="">Por definir</option>${[1,2,3,6,12].map(n=>`<option value="${n}" ${p.months===n?'selected':''}>Cada ${n} mes(es)</option>`).join('')}</select></label><label>Patrón de visitas<select name="plan_cadence"><option value="monthly">Una por frecuencia</option><option value="twice_monthly" ${p.cadence==='twice_monthly'?'selected':''}>Dos al mes (frecuencia mensual)</option></select></label><label>Segundo día del mes (solo dos al mes)<input name="plan_second_day" type="number" min="1" max="28" value="${esc(p.second_day??'')}"></label><label>Primera fecha prevista<input name="plan_start" type="date" value="${esc(p.start||'')}"></label><label>Importe total acordado del período USD<input name="plan_price" type="number" min="0" step="0.01" value="${esc(p.price??'')}"></label></div><label>Revisiones incluidas<textarea name="plan_reviews" maxlength="250">${esc(p.reviews||'')}</textarea></label><label><input style="width:auto;display:inline" type="checkbox" name="plan_confirmed" ${p.confirmed?'checked':''}> El cliente aceptó estas condiciones</label><label><input style="width:auto;display:inline" type="checkbox" name="plan_active" ${p.active?'checked':''}> Activar generación diaria de visitas</label>${p.start&&p.visits&&p.months?`<p>Calendario previsto: ${ThinkCareMembership.dates(p).map(esc).join(' · ')}</p>`:''}<p class="muted">La duración limita el calendario y permite avisar la renovación; la frecuencia define cuándo se repiten las visitas. Confirmar la tarifa no registra un pago.</p></fieldset>`;}

async function load(){if(busy)return;try{const d=await api();rows=d.rows;inboxPartial=!!d.partial;team=d.staff||[];const selectedOwner=$('ownerFilter').value;$('ownerFilter').innerHTML='<option value="">Todos los responsables</option><option value="unassigned">Sin asignar</option>'+team.map(u=>`<option value="${esc(u.email)}">${esc(u.nombre||u.email)}</option>`).join('');$('ownerFilter').value=selectedOwner;canManage=d.can_manage;canConvert=d.can_convert;render();message(d.support_error||(d.partial?'Mostrando las últimas 500 solicitudes.':'Bandeja actualizada.'))}catch(e){if(/Inicia sesión|sesión/i.test(e.message)){rows=[];team=[];canManage=false;canConvert=false;render();window.ThinkCareDashboard?.clear();}message(e.message,true)}}
async function mutate(button,payload){if(busy)return;busy=true;button.disabled=true;try{await api('POST',payload);message('Gestión guardada.');busy=false;await load()}catch(e){message(e.message,true)}finally{busy=false;button.disabled=false}}
$('list').addEventListener('submit',async e=>{const notify=e.target.closest('[data-notify]');if(notify){e.preventDefault();const r=rows.find(x=>x.id===notify.dataset.notify),data=Object.fromEntries(new FormData(notify));if(confirm('¿Enviar esta actualización al cliente por WhatsApp?'))await mutate(notify.querySelector('button'),{action:'notify',id:r.id,revision:r.revision,...data});return}const form=e.target.closest('[data-edit]');if(!form)return;e.preventDefault();const r=rows.find(x=>x.id===form.dataset.edit),data=Object.fromEntries(new FormData(form));try{if(data.plan_enabled&&data.plan_active&&(!data.plan_code||!data.plan_term))throw Error('Selecciona el plan específico y la duración antes de activarlo');const existing=ThinkCareMembership.read(r.internal_note).plan;if(data.plan_enabled)data.note=ThinkCareMembership.write(data.note,{version:1,code:data.plan_code,term_months:data.plan_term,cadence:data.plan_cadence,second_day:data.plan_second_day,active:!!data.plan_active,confirmed:!!data.plan_confirmed,devices:data.plan_devices,visits:data.plan_visits,months:data.plan_months,start:data.plan_start,price:data.plan_price,reviews:data.plan_reviews});else if(existing){if(!confirm('¿Retirar la configuración de membresía y detener las futuras visitas?'))return;} }catch(err){message(err.message,true);return;}if(data.scheduled_at)data.scheduled_at=new Date(data.scheduled_at+':00-04:00').toISOString();let confirmation;if(data.status==='scheduled'){confirmation=prompt('Indica cómo y cuándo el cliente confirmó esta fecha y horario (mínimo 8 caracteres).');if(!confirmation)return}await mutate(form.querySelector('button'),{action:'update',id:r.id,revision:r.revision,...data,quote_amount:data.quote_amount===''?null:Number(data.quote_amount),confirmation})});
$('list').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const id=b.dataset.approve||b.dataset.convert||b.dataset.history;if(!id)return;const r=rows.find(x=>x.id===id);if(b.dataset.history){try{const d=await api('GET',null,'?id='+id);$('history-'+id).innerHTML=d.history.map(h=>`<div class="row"><b>${esc(h.action)} · ${date(h.created_at)}</b><p>${esc(h.actor_email||'Sistema')} · ${esc(h.note)}</p></div>`).join('')||'<p>Sin gestiones registradas todavía.</p>'}catch(e){message(e.message,true)}return}if(b.dataset.convert&&ThinkCareMembership.read(r.internal_note).plan){message('Gestiona el servicio desde cada visita generada. Conserva este registro para administrar la membresía.',true);return;}if(b.dataset.approve){const evidence=prompt('Registra la autorización REAL del cliente para el servicio y, si hay cotización, su importe. Incluye fecha y referencia del mensaje. No es la simple aceptación del formulario.');if(evidence)await mutate(b,{action:'approve',id,revision:r.revision,evidence})}else{const confirmation=prompt('Solo continúa si el servicio realmente va a comenzar o recibiste el equipo. Describe esa confirmación (mínimo 8 caracteres). No se registrará ningún cobro.');if(confirmation&&confirm('¿Crear la orden formal de Soporte? Esta solicitud quedará vinculada a una única orden.'))await mutate(b,{action:'convert',id,revision:r.revision,confirmation})}});
$('create').onsubmit=async e=>{e.preventDefault();const form=e.target;const data=Object.fromEntries(new FormData(form));const button=form.querySelector('button');if(busy)return;busy=true;button.disabled=true;try{await api('POST',{action:'create',client_id:createId,...data});createId=crypto.randomUUID();form.reset();form.hidden=true;busy=false;await load()}catch(e){message(e.message,true)}finally{busy=false;button.disabled=false}};
$('new').onclick=()=>{$('create').hidden=false};$('cancelCreate').onclick=()=>{$('create').hidden=true};$('refresh').onclick=load;$('filter').onchange=render;$('typeFilter').onchange=render;$('ownerFilter').onchange=render;$('agendaFilter').onchange=render;$('search').oninput=render;if(new URLSearchParams(location.search).get('thinkcare')==='1')$('typeFilter').value='care_all';load();sb.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT'){rows=[];team=[];canManage=false;canConvert=false;render();window.ThinkCareDashboard?.clear();}});setInterval(()=>{if(!document.hidden&&!document.querySelector('details[open]')&&!busy)load()},30000);
</script></body></html>
