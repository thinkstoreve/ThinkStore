<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Ficha CRM · ThinkStore</title><link rel="icon" href="logo-thinkstore.png"><style>
:root{--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--muted:#6e6e73;--line:#e5e5ea}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--text);opacity:0;transform:translateY(12px);animation:in .42s cubic-bezier(.2,.8,.2,1) forwards}@keyframes in{to{opacity:1;transform:none}}
.top{position:sticky;top:0;background:rgba(245,245,247,.88);backdrop-filter:blur(22px);border-bottom:1px solid var(--line)}.topin{max-width:1100px;margin:auto;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:10px;font-weight:850}.brand img{width:42px;height:42px}.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;text-decoration:none;color:#111;font-weight:760}.wrap{max-width:1100px;margin:28px auto;padding:0 18px}.hero h1{font-size:clamp(34px,5vw,54px);margin:7px 0;letter-spacing:-1.5px}.eyebrow{font-size:11px;letter-spacing:1.5px;color:#0071e3;font-weight:850}.muted{color:var(--muted)}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.kpi{background:#111;color:#fff;border-radius:22px;padding:18px}.kpi small{color:#c7c7cc}.kpi b{display:block;font-size:25px;margin-top:7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 12px 30px rgba(0,0,0,.04)}.row{display:grid;grid-template-columns:130px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid #f0f0f2}.row:last-child{border:0}.row span{color:var(--muted)}@media(max-width:750px){.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:500px){.kpis{grid-template-columns:1fr}.row{grid-template-columns:1fr}}
</style></head><body><header class="top"><div class="topin"><div class="brand"><img src="logo-thinkstore.png"><span>ThinkStore · CRM</span></div><div><a class="btn" href="panel.html#clientes">Volver al panel</a> <button class="btn" onclick="window.close()">Cerrar</button></div></div></header><main class="wrap"><div id="app"></div></main><script>
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])),money=n=>'$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),dt=v=>{const d=new Date(v);return isNaN(d)?String(v||'—'):d.toLocaleString('es-VE',{dateStyle:'medium',timeStyle:'short',timeZone:'America/Caracas'})};
let c={};try{c=JSON.parse(localStorage.getItem('ts_crm_customer_snapshot')||'{}')}catch{}const rows=a=>a.map(([k,v])=>`<div class="row"><span>${esc(k)}</span><b>${esc(v||'—')}</b></div>`).join('');
document.getElementById('app').innerHTML=`<section class="hero"><div class="eyebrow">${esc(c._origin||'CLIENTE')}</div><h1>${esc(c._name||c.name||'Cliente')}</h1><div class="muted">${esc(c._email||c.email||'')}</div></section><div class="kpis"><div class="kpi"><small>Pedidos</small><b>${Number(c._orders||0)}</b></div><div class="kpi"><small>Gasto acumulado</small><b>${money(c._spend||0)}</b></div><div class="kpi"><small>Garantías activas</small><b>${Number(c._warranties||0)}</b></div><div class="kpi"><small>Soporte</small><b>${Number(c._repairs||0)}</b></div></div><div class="grid"><section class="card"><h2>Datos del cliente</h2>${rows([['Correo',c._email||c.email],['Teléfono',c._phone||c.phone],['Documento',c.id||c.cedula_rif||c.document],['Dirección',c.address],['Ciudad',c.city],['Estado',c.state],['Registro',dt(c.created_at)]])}</section><section class="card"><h2>Actividad comercial</h2>${rows([['Origen',c._origin],['Último pedido',c._last?(c._last.code||c._last.codigo):'—'],['Fecha último pedido',c._last?dt(c._last.created_at||c._last.date):'—'],['Total de compras',String(c._orders||0)],['Compra acumulada',money(c._spend||0)]])}</section><section class="card"><h2>CRM</h2><div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px">${(c._crm_tags||[]).map(t=>`<span style="background:#f2f4f7;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:800">${esc(t)}</span>`).join('')||'<span class="muted">Sin etiquetas</span>'}</div><div class="row"><span>Nota interna</span><b>${esc(c._crm_note||'Sin notas internas')}</b></div></section></div>`;
</script></body></html>
